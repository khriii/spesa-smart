<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 220px;
      padding: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      background: #2e7d32;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #999;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <button id="syncBtn">Aggiorna sessione Iperal</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
